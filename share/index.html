<title>Вулик · відео</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one column, video on top, short how-to-save note under it */
:root { --bg:#f6f3ec; --fg:#2a2112; --muted:#6e624d; --honey:#c98a12; --card:#fffaf0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16120b; --fg:#f2e8d6; --muted:#b3a58b; --honey:#f0b43c; --card:#221b10; color-scheme: dark } }
:root[data-theme="dark"] { --bg:#16120b; --fg:#f2e8d6; --muted:#b3a58b; --honey:#f0b43c; --card:#221b10; color-scheme: dark }
body { background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 40px; }
main { max-width:460px; margin:0 auto; display:grid; gap:16px; }
h1 { font-size:22px; margin:0; text-wrap:balance; }
h1 span { color:var(--honey); }
video { width:100%; max-width:100%; aspect-ratio:9/16; background:#000; border-radius:12px; }
.note { background:var(--card); border-radius:12px; padding:14px 16px; color:var(--muted); font-size:15px; }
.note b { color:var(--fg); }
</style>
<main>
  <h1>Вулик <span>·</span> Частина 1 · Старт</h1>
  <video id="v1" src="part1.mp4" controls playsinline preload="metadata"></video>
  <h1>Вулик <span>·</span> Частина 4 · Перевірка</h1>
  <video id="v4" src="part4.mp4" controls playsinline preload="metadata"></video>
  <div class="note">Оригінали: 1080×1920, 12&nbsp;МБ кожне.<br>
  <b>Android:</b> ⋮ у плеєрі → «Завантажити».<br>
  <b>iPhone:</b> відкрий цю сторінку в Safari, на весь екран → «Поділитися» → «Зберегти відео».</div>
</main>
