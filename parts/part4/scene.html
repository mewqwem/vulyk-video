<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter.ttf') format('truetype');font-weight:100 900;}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#EFE6DA}
svg{display:block}
text{font-family:'Inter';}
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ---------- helpers ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOut=k=>1-Math.pow(1-k,3);
const easeInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const back=k=>{const c=1.70158;k=clamp(k);return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const prog=(t,t0,d)=>clamp((t-t0)/d);
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')+')';};
function pop(t,t0,body,cx,cy,d=.35){ // scale-in around a point
  if(window.__pops) window.__pops.push([t0, window.__kind||'pop']); // render.py --pops collects these for sound cues
  const k=prog(t,t0,d); if(k<=0) return '';
  const s=back(k);
  return `<g opacity="${clamp(k*3)}" transform="translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})">${body}</g>`;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

// ---------- character ----------
function person(x,y,sc=1,mood='neutral',t=0,o={}){
  const shirt=o.shirt||'#2f7f86', shirt2=o.shirt2||'#276b71', hair=o.hair||'#6b4226', pants=o.pants||'#2b2f3a';
  // y = feet line
  const bob=Math.sin(t*2.2)*3;
  let mouth, brows='';
  if(mood==='happy') mouth=`<path d="M-22 18 Q0 40 22 18" stroke="#3a2a22" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  else if(mood==='sad'||mood==='worried') mouth=`<path d="M-18 30 Q0 16 18 30" stroke="#3a2a22" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  else mouth=`<path d="M-16 24 L16 24" stroke="#3a2a22" stroke-width="6" stroke-linecap="round"/>`;
  if(mood==='worried'||mood==='sad') brows=`<path d="M-46 -20 L-20 -32 M46 -20 L20 -32" stroke="#4a3020" stroke-width="7" stroke-linecap="round"/>`;
  const sweat = mood==='worried'?`<path d="M62 -40 q8 14 0 20 q-8 -6 0 -20z" fill="#7cc6ff"/>`:'';
  return `<g transform="translate(${x} ${y+bob}) scale(${sc})">
    <ellipse cx="0" cy="0" rx="110" ry="16" fill="#000" opacity=".08"/>
    <!-- legs -->
    <rect x="-52" y="-200" width="44" height="190" rx="12" fill="${pants}"/>
    <rect x="8" y="-200" width="44" height="190" rx="12" fill="${pants}"/>
    <rect x="-62" y="-22" width="58" height="22" rx="10" fill="#15171c"/>
    <rect x="4" y="-22" width="58" height="22" rx="10" fill="#15171c"/>
    <!-- body -->
    <rect x="-82" y="-420" width="164" height="240" rx="34" fill="${shirt}"/>
    <rect x="-36" y="-290" width="72" height="44" rx="10" fill="${shirt2}"/>
    <!-- arms -->
    <rect x="-112" y="-405" width="40" height="190" rx="20" fill="${shirt}"/>
    <rect x="72" y="-405" width="40" height="190" rx="20" fill="${shirt}"/>
    <circle cx="-92" cy="-210" r="20" fill="#f2c7a5"/>
    <circle cx="92" cy="-210" r="20" fill="#f2c7a5"/>
    <!-- neck/head -->
    <rect x="-20" y="-440" width="40" height="30" fill="#e8b892"/>
    <g transform="translate(0 -520)">
      <circle cx="-86" cy="6" r="18" fill="#f2c7a5"/>
      <circle cx="86" cy="6" r="18" fill="#f2c7a5"/>
      <rect x="-88" y="-90" width="176" height="176" rx="80" fill="#f2c7a5"/>
      <path d="M-92 -10 Q-96 -104 0 -106 Q96 -104 92 -10 Q70 -60 20 -56 Q-30 -70 -92 -10z" fill="${hair}"/>
      ${brows}
      <circle cx="-32" cy="-6" r="9" fill="#2a1d16"/>
      <circle cx="32" cy="-6" r="9" fill="#2a1d16"/>
      ${mouth}${sweat}
    </g>${o.extra||''}
  </g>`;
}

// ---------- UI pieces ----------
function balanceCard(val,color,barK){
  return `<g>
   <rect x="60" y="80" width="960" height="190" rx="26" fill="#fff" />
   <text x="100" y="135" font-size="26" font-weight="700" fill="#9a9a9a" letter-spacing="2">НА РАХУНКУ</text>
   <text x="100" y="215" font-size="74" font-weight="900" fill="${color}">${fmt(val)} ₴</text>
   <rect x="100" y="238" width="880" height="10" rx="5" fill="#eee"/>
   <rect x="100" y="238" width="${880*barK}" height="10" rx="5" fill="${color}"/>
  </g>`;
}
function pill(x,y,label,bg='#2b2f3a',fg='#fff'){
  const w=label.length*17+44;
  return `<g><rect x="${x}" y="${y}" width="${w}" height="46" rx="10" fill="${bg}"/>
  <text x="${x+22}" y="${y+31}" font-size="24" font-weight="800" fill="${fg}" letter-spacing="1.5">${label}</text></g>`;
}
function tag(x,y,label,bg='#E23B3B'){ // price tag, x = center
  const w=label.length*24+60;
  return `<g><rect x="${x-w/2}" y="${y-36}" width="${w}" height="72" rx="14" fill="${bg}"/>
  <circle cx="${x-w/2+22}" cy="${y}" r="6" fill="#fff"/>
  <text x="${x+10}" y="${y+14}" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">${label}</text></g>`;
}
function hexagon(cx,cy,r,fill,stroke){
  let p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}
  return `<polygon points="${p.join(' ')}" fill="${fill}" ${stroke?`stroke="${stroke}" stroke-width="6"`:''}/>`;
}
function meadGlass(cx,cy,s=1,fillK=1,hue='#F2A516'){
  // tumbler with amber liquid
  const h=140*s,w=100*s, lh=h*0.75*fillK;
  return `<g>
   <path d="M${cx-w/2} ${cy-h/2} L${cx+w/2} ${cy-h/2} L${cx+w/2-10*s} ${cy+h/2} L${cx-w/2+10*s} ${cy+h/2}Z" fill="#ffffff" opacity=".35"/>
   <path d="M${cx-w/2+ (1-lh/h)*10*s} ${cy+h/2-lh} L${cx+w/2-(1-lh/h)*10*s} ${cy+h/2-lh} L${cx+w/2-10*s} ${cy+h/2} L${cx-w/2+10*s} ${cy+h/2}Z" fill="${hue}"/>
   <rect x="${cx-w/2+14*s}" y="${cy-h/2+12*s}" width="${8*s}" height="${h*0.6}" rx="${4*s}" fill="#fff" opacity=".5"/>
  </g>`;
}
function bee(x,y,s=1,t=0){
  const f=Math.sin(t*40)*0.5+0.5;
  return `<g transform="translate(${x} ${y}) scale(${s})">
   <ellipse cx="-6" cy="-26" rx="16" ry="${10+f*6}" fill="#fff" opacity=".85"/>
   <ellipse cx="10" cy="-26" rx="16" ry="${10+(1-f)*6}" fill="#fff" opacity=".85"/>
   <ellipse cx="0" cy="0" rx="34" ry="24" fill="#F7C531"/>
   <rect x="-12" y="-23" width="9" height="46" fill="#2a1d16"/>
   <rect x="6" y="-22" width="9" height="44" fill="#2a1d16"/>
   <circle cx="26" cy="-4" r="4" fill="#2a1d16"/>
  </g>`;
}

// ---------- captions ----------
function caption(t){
  const W=window.WORDS; if(!W) return '';
  // groups of up to 3 words, break at phrase boundaries
  const groups=window.GROUPS;
  let g=null;
  for(const gr of groups){ if(t>=gr.start && t<gr.end) {g=gr;break;} }
  if(!g) return '';
  // karaoke: only the word being spoken now is coloured (it stays lit through the short gap after it)
  let cur=-1; g.words.forEach((w,i)=>{ if(t>=w.s-0.03) cur=i; });
  const txt=g.words.map((w,i)=>{
    const col=i===cur?'#FF6A2B':'#ffffff';
    return `<tspan fill="${col}">${esc(w.text.toUpperCase())}</tspan>`;
  }).join(' ');
  const k=prog(t,g.start,.12), s=lerp(.86,1,back(k));
  const chars=g.words.map(w=>w.text).join(' ').length;
  const fs=Math.min(76, 960/(chars*0.72+(g.words.length-1)*0.3));
  return `<g transform="translate(540 1640) scale(${s})">
    <text x="0" y="0" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="900" stroke="#111" stroke-width="16" stroke-linejoin="round" paint-order="stroke" letter-spacing="-1" word-spacing="${(fs*0.3).toFixed(1)}">${txt}</text></g>`;
}

// ---------- props from part 1 ----------
function floor(col='#d9ccbb'){ return `<rect x="0" y="1380" width="1080" height="540" fill="${col}"/><rect x="0" y="1380" width="1080" height="8" fill="#00000018"/>`; }
function stamp(t,t0,txt,cx,cy,col='#E23B3B',rot=-8,fs=64){
  const w=txt.length*fs*0.72+70; window.__kind='stamp';
  try { return pop(t,t0,`<g transform="translate(${cx} ${cy}) rotate(${rot})"><rect x="${-w/2}" y="-55" width="${w}" height="110" rx="10" fill="#fff" stroke="${col}" stroke-width="10"/>
   <text x="0" y="${fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="900" fill="${col}" letter-spacing="2">${txt}</text></g>`,cx,cy,.28); } finally { window.__kind=null; }
}
function bubble(x,y,w,h,txt,fs=40,tailX=null){
  tailX = tailX??(x+60);
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="30" fill="#fff"/><path d="M${tailX} ${y+h-2} l20 46 l26 -46z" fill="#fff"/>
   <text x="${x+w/2}" y="${y+h/2+fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#2b2f3a">${txt}</text>`;
}
function storefront(cx,by,opts={}){ // by = bottom y
  const w=opts.w||640,h=opts.h||560, x=cx-w/2, y=by-h;
  return `<g>
   <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${opts.wall||'#c8a27a'}"/>
   ${[0,1,2].map(i=>`<rect x="${x+40+i*(w-80)/3+10}" y="${y+30}" width="${(w-80)/3-20}" height="110" rx="6" fill="#8fb0c4"/>`).join('')}
   <rect x="${x-20}" y="${y+170}" width="${w+40}" height="20" fill="#7a5a3c"/>
   <rect x="${x+40}" y="${y+230}" width="${w*0.45}" height="${h-230}" fill="#9cc0d4" stroke="#5b4430" stroke-width="12"/>
   <rect x="${cx+w*0.1}" y="${y+230}" width="${w*0.3}" height="${h-230}" fill="#5b4430"/>
   <circle cx="${cx+w*0.36}" cy="${by-(h-230)/2}" r="9" fill="#F7C531"/>
   ${opts.year?`<text x="${cx}" y="${y+168}" text-anchor="middle" font-size="34" font-weight="900" fill="#5b4430">${opts.year}</text>`:''}
  </g>`;
}
function vat(cx,by,s=1){
  return `<g transform="translate(${cx} ${by}) scale(${s})">
   <rect x="-90" y="-300" width="180" height="280" rx="40" fill="#C8763A"/><rect x="-90" y="-300" width="180" height="40" rx="20" fill="#E09455"/>
   <rect x="-60" y="-250" width="16" height="200" rx="8" fill="#E8A56B" opacity=".7"/>
   <rect x="-70" y="-20" width="20" height="20" fill="#7a4a24"/><rect x="50" y="-20" width="20" height="20" fill="#7a4a24"/>
   <rect x="80" y="-110" width="40" height="18" rx="6" fill="#7a4a24"/></g>`;
}
function doc(cx,cy,title,s=1,col='#2b2f3a'){
  return `<g transform="translate(${cx} ${cy}) scale(${s})"><rect x="-110" y="-140" width="220" height="280" rx="14" fill="#fff" stroke="#ddd" stroke-width="4"/>
   ${[0,1,2,3].map(i=>`<rect x="-75" y="${-60+i*36}" width="${150-(i%2)*40}" height="12" rx="6" fill="#ddd"/>`).join('')}
   <text x="0" y="-90" text-anchor="middle" font-size="26" font-weight="900" fill="${col}">${title}</text></g>`;
}
function factory(cx,by){
  return `<g transform="translate(${cx} ${by})"><rect x="-150" y="-160" width="300" height="160" fill="#7d8796"/>
   <path d="M-150 -160 l60 -60 v60 l60 -60 v60 l60 -60 v60z" fill="#7d8796"/><rect x="90" y="-300" width="40" height="160" fill="#5d6673"/>
   <circle cx="110" cy="-330" r="24" fill="#c9ced6"/><circle cx="140" cy="-370" r="30" fill="#dfe2e7"/>
   ${[0,1,2].map(i=>`<rect x="${-120+i*90}" y="-110" width="60" height="50" fill="#F7C531"/>`).join('')}</g>`;
}
function socket(cx,cy,t){
  const sp=Math.sin(t*30)>0;
  return `<g transform="translate(${cx} ${cy})"><rect x="-90" y="-90" width="180" height="180" rx="24" fill="#f4efe6" stroke="#bbb" stroke-width="6"/>
   <circle cx="0" cy="0" r="56" fill="#e2dbcf"/><circle cx="-20" cy="0" r="10" fill="#555"/><circle cx="20" cy="0" r="10" fill="#555"/>
   ${sp?`<path d="M60 -60 l40 -30 l-10 30 l40 -20 M70 -20 l50 -10" stroke="#F7C531" stroke-width="10" fill="none" stroke-linecap="round"/>`:''}
   <path d="M-60 -70 q-30 -60 10 -90" stroke="#333" stroke-width="5" fill="none" opacity=".5"/></g>`;
}
function toilet(cx,by){
  return `<g transform="translate(${cx} ${by})"><rect x="-70" y="-260" width="110" height="120" rx="14" fill="#fff" stroke="#ccc" stroke-width="5"/>
   <path d="M-100 -140 h180 q0 90 -90 100 q-90 -10 -90 -100z" fill="#fff" stroke="#ccc" stroke-width="5"/><rect x="-40" y="-40" width="80" height="40" fill="#fff" stroke="#ccc" stroke-width="5"/></g>`;
}
function neonSign(cx,cy,on){
  const c=on?'#FFB22E':'#5a4a3a', glow=on?`filter="url(#glow)"`:'';
  return `<g transform="translate(${cx} ${cy})" ${glow}>${hexagon(-150,0,60,'none')}<polygon points="${[0,1,2,3,4,5].map(i=>{const a=Math.PI/3*i+Math.PI/6;return (-150+60*Math.cos(a))+','+(60*Math.sin(a));}).join(' ')}" fill="none" stroke="${c}" stroke-width="12"/>
   <text x="60" y="26" text-anchor="middle" font-size="84" font-weight="900" fill="none" stroke="${c}" stroke-width="7" letter-spacing="6">ВУЛИК</text></g>`;
}
function woodSign(cx,cy){
  return `<g transform="translate(${cx} ${cy})"><rect x="-240" y="-70" width="480" height="140" rx="16" fill="#8a5a32" stroke="#5b3a1e" stroke-width="10"/>
   <text x="0" y="26" text-anchor="middle" font-size="76" font-weight="900" fill="#F7E3B0" letter-spacing="6">ВУЛИК</text></g>`;
}
function hexCounter(cx,by,w=760){
  let o=`<rect x="${cx-w/2}" y="${by-260}" width="${w}" height="40" rx="10" fill="#5b3a1e"/>`;
  const r=46;
  for(let row=0;row<2;row++)for(let c=0;c<9;c++){const x=cx-w/2+50+c*r*1.732+(row%2?r*0.866:0);if(x>cx+w/2-40)continue;o+=hexagon(x,by-180+row*r*1.5,r-4,'#F2A516','#C47A10');}
  return o;
}
function chair(x,by){ return `<g transform="translate(${x} ${by})"><rect x="-40" y="-170" width="16" height="170" fill="#5b3a1e"/><rect x="-40" y="-80" width="90" height="16" fill="#8a5a32"/><rect x="34" y="-80" width="16" height="80" fill="#5b3a1e"/></g>`; }
function plant(x,by){ return `<g transform="translate(${x} ${by})"><rect x="-40" y="-80" width="80" height="80" rx="10" fill="#c9764a"/><ellipse cx="-30" cy="-140" rx="30" ry="60" fill="#3f9a5c"/><ellipse cx="25" cy="-150" rx="28" ry="70" fill="#4fb36c"/><ellipse cx="0" cy="-170" rx="24" ry="70" fill="#3f9a5c"/></g>`; }
function fridge(x,by){ return `<g transform="translate(${x} ${by})"><rect x="-100" y="-420" width="200" height="420" rx="18" fill="#dfe6ea" stroke="#b7c2c9" stroke-width="6"/><rect x="-80" y="-400" width="160" height="300" rx="8" fill="#9cc7dc"/>
   ${[0,1,2].map(r=>[0,1,2,3].map(c=>`<rect x="${-68+c*38}" y="${-380+r*95}" width="22" height="70" rx="6" fill="${['#F2A516','#C7451B','#E3B04B','#9C5A1A'][(r+c)%4]}"/>`).join('')).join('')}</g>`; }
function iceMachine(x,by){ return `<g transform="translate(${x} ${by})"><rect x="-90" y="-200" width="180" height="200" rx="14" fill="#c9d3d9"/><rect x="-60" y="-160" width="120" height="70" rx="8" fill="#e9f6fb"/>
   ${[0,1,2].map(i=>`<rect x="${-50+i*36}" y="-145" width="28" height="28" rx="6" fill="#bfe6f5" stroke="#8cc9e0" stroke-width="3"/>`).join('')}</g>`; }
function register(x,by){ return `<g transform="translate(${x} ${by})"><rect x="-110" y="-120" width="220" height="120" rx="12" fill="#3d4450"/><rect x="-70" y="-210" width="140" height="80" rx="8" fill="#22262d"/><text x="0" y="-158" text-anchor="middle" font-size="34" font-weight="900" fill="#5fe08a">25 000</text>
   ${[0,1,2].map(r=>[0,1,2,3].map(c=>`<rect x="${-90+c*46}" y="${-105+r*32}" width="36" height="24" rx="5" fill="#5d6673"/>`).join('')).join('')}</g>`; }
function crate(x,by,t0,t){
  let o=`<rect x="-150" y="-110" width="300" height="110" rx="10" fill="#a8743f" stroke="#7a5228" stroke-width="6"/>`;
  for(let i=0;i<4;i++){const c=['#F2A516','#C7451B','#E3B04B','#9C5A1A','#B8321F','#F0D27A','#E07B16','#F7C531'][(i+t0*7|0)%8];
    o=`<rect x="${-120+i*66}" y="-220" width="44" height="130" rx="10" fill="${c}"/><rect x="${-110+i*66}" y="-260" width="24" height="50" rx="6" fill="${c}"/>`+o;}
  return `<g transform="translate(${x} ${by})">${o}</g>`;
}
function generator(x,by){ return `<g transform="translate(${x} ${by})"><rect x="-150" y="-200" width="300" height="200" rx="16" fill="#E8901A"/><rect x="-120" y="-170" width="160" height="110" rx="8" fill="#3d4450"/>
   ${[0,1,2,3].map(i=>`<rect x="-110" y="${-160+i*25}" width="140" height="10" rx="5" fill="#5d6673"/>`).join('')}<circle cx="95" cy="-115" r="28" fill="#3d4450"/><rect x="-140" y="-10" width="40" height="20" fill="#2b2f3a"/><rect x="100" y="-10" width="40" height="20" fill="#2b2f3a"/></g>`; }
function powerStation(x,by){ return `<g transform="translate(${x} ${by})"><rect x="-90" y="-150" width="180" height="150" rx="16" fill="#3d4450"/><rect x="-60" y="-120" width="120" height="50" rx="6" fill="#22262d"/><rect x="-54" y="-114" width="${80}" height="38" rx="4" fill="#5fe08a"/><rect x="-60" y="-180" width="120" height="30" rx="10" fill="#5d6673"/></g>`; }
function note(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="30" ry="22" fill="#2b2f3a" transform="rotate(-20)"/><rect x="22" y="-130" width="12" height="130" fill="#2b2f3a"/><path d="M34 -130 q50 20 30 70 q0 -40 -30 -40z" fill="#2b2f3a"/></g>`; }
function moneyBag(x,by,label){ return `<g transform="translate(${x} ${by})"><path d="M-130 0 q-30 -170 80 -220 h100 q110 50 80 220z" fill="#4fb36c"/><path d="M-50 -220 l-30 -50 h160 l-30 50z" fill="#3f9a5c"/><rect x="-60" y="-235" width="120" height="22" rx="10" fill="#2e7a46"/>
   <text x="0" y="-80" text-anchor="middle" font-size="54" font-weight="900" fill="#fff">${label}</text></g>`; }
function beer(x,y){ return `<g transform="translate(${x} ${y})"><rect x="-55" y="-90" width="110" height="180" rx="12" fill="#F2B632"/><rect x="-55" y="-110" width="110" height="40" rx="20" fill="#fff"/><path d="M55 -50 h30 q20 0 20 20 v50 q0 20 -20 20 h-30" stroke="#F2B632" stroke-width="16" fill="none"/></g>`; }
function shot(x,y){ return `<g transform="translate(${x} ${y})"><path d="M-40 -60 h80 l-10 120 h-60z" fill="#e9f3f6" stroke="#b7c2c9" stroke-width="5"/><path d="M-35 -20 h70 l-6 78 h-58z" fill="#d9eef5"/></g>`; }
function door(x,by,label,col){ return `<g transform="translate(${x} ${by})"><rect x="-130" y="-520" width="260" height="520" rx="14" fill="${col}"/><rect x="-100" y="-490" width="200" height="200" rx="8" fill="#ffffff22"/><rect x="-100" y="-260" width="200" height="200" rx="8" fill="#ffffff22"/><circle cx="90" cy="-250" r="12" fill="#F7C531"/>
   <text x="0" y="-560" text-anchor="middle" font-size="46" font-weight="900" fill="#2b2f3a">${label}</text></g>`; }
const APRON={extra:`<rect x="-70" y="-330" width="140" height="190" rx="14" fill="#F7C531"/><rect x="-70" y="-280" width="140" height="24" fill="#2a1d16"/><rect x="-70" y="-220" width="140" height="24" fill="#2a1d16"/>`};
const SUIT={shirt:'#33384a',shirt2:'#2a2e3d',hair:'#2a2a2a',extra:`<path d="M0 -420 l-14 20 l14 110 l14 -110z" fill="#C7451B"/>`};

// ===================== PART 4 · ПЕРЕВІРКА =====================
const START=307500, PEAK=360000;
const DAY={h:56,j:49,m:50,w:54,i:56,n2:56,n3:59,n4:59,n5:59,k1:61,k2:62,f:62};

function dayOf(key){ return DAY[key]||DAY[key[0]]; }
function S(key){ return window.PH.find(p=>p.scene===key); }
function W(key,i){ const p=S(key); const w=p.words; return w[Math.max(0,Math.min(i,w.length-1))].s; } // start of word i
function balanceAt(t){
  let v=START; for(const p of window.PH) for(const [td,a] of p.ded) v-=a*easeInOut(prog(t,td,.6));
  return v;
}
function balColor(v){ const k=v/PEAK; return k>0.45?'#2E9E57':(k>0.15?'#E8901A':'#E23B3B'); }
function moneyFloats(t){
  let o='';
  for(const p of window.PH) for(const [td,a] of p.ded){
    const k=(t-td)/1.4; if(k<0||k>1) continue;
    const inc=a<0;
    o+=`<text x="980" y="${330-k*40}" text-anchor="end" font-size="58" font-weight="900" fill="${inc?'#2E9E57':'#E23B3B'}" opacity="${1-Math.pow(k,3)}" stroke="#fff" stroke-width="10" paint-order="stroke">${inc?'+':'−'}${fmt(Math.abs(a))} ₴</text>`;
  }
  return o;
}
function header(t,key){
  const v=balanceAt(t), col=balColor(v), d=dayOf(key);
  // when did this day start?
  let d0=0, prev=null; for(const p of window.PH){ if(p.s>t+0.05) break; const dd=dayOf(p.scene); if(dd!==prev){ d0=p.s; prev=dd; } }
  const k=prog(t,d0,.45), s=d0>0.5?lerp(1.5,1,back(k)):1;
  return `<g>
   <rect x="60" y="80" width="960" height="190" rx="26" fill="#fff" />
   <text x="100" y="135" font-size="26" font-weight="700" fill="#9a9a9a" letter-spacing="2">НА РАХУНКУ</text>
   <text x="100" y="215" font-size="74" font-weight="900" fill="${col}">${fmt(v)} ₴</text>
   <rect x="100" y="238" width="880" height="10" rx="5" fill="#eee"/>
   <rect x="100" y="238" width="${880*clamp(v/PEAK)}" height="10" rx="5" fill="${col}"/>
   <line x1="760" y1="110" x2="760" y2="215" stroke="#eee" stroke-width="4"/>
   <text x="980" y="135" text-anchor="end" font-size="26" font-weight="700" fill="#9a9a9a" letter-spacing="2">ДЕНЬ</text>
   <g transform="translate(980 215) scale(${s}) translate(-980 -215)"><text x="980" y="215" text-anchor="end" font-size="74" font-weight="900" fill="#2b2f3a">${d}</text></g>
  </g>`;
}
